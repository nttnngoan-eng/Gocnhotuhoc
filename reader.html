<script src="data.js?v=22.6"></script><script>
(function(){
  const data = window.GNTT_DATA || {books:[]};
  const params = new URLSearchParams(location.search);
  const requestedId = params.get('id');

  let found = null;
  for(const book of (data.books || [])){
    for(const chapter of (book.chapters || [])){
      for(const lesson of (chapter.lessons || [])){
        if(!found && (!requestedId || lesson.id === requestedId)){
          found = {book, chapter, lesson};
          if(requestedId && lesson.id === requestedId) break;
        }
      }
      if(found && requestedId) break;
    }
    if(found && requestedId) break;
  }

  if(!found){
    const title = document.querySelector('.reader-paper > h1');
    const article = document.querySelector('.reader-content');
    if(title) title.textContent = 'Không tìm thấy bài học';
    if(article) article.innerHTML = '<p>Bài học này chưa tồn tại hoặc đã được đổi mã.</p>';
    return;
  }

  const {book, chapter, lesson} = found;
  window.GNTT_CURRENT_LESSON_ID = lesson.id;

  const category = document.querySelector('.reader-category');
  const title = document.querySelector('.reader-paper > h1');
  const subtitle = document.querySelector('.reader-paper > .subtitle');
  const article = document.querySelector('.reader-content');
  const footerTitle = document.querySelector('[data-reader-footer-title]');

  if(category) category.textContent = [book.title, chapter.title].filter(Boolean).join(' · ');
  if(title) title.textContent = lesson.title || 'Bài học';
  if(subtitle) subtitle.textContent = lesson.subtitle || '';
  if(footerTitle) footerTitle.textContent = lesson.title || '';
  document.title = (lesson.title || 'Bài đọc') + ' | Góc nhỏ tu học';

  let body = lesson.contentHtml || '';
  if(lesson.youtube){
    body = '<p>' + lesson.youtube.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</p>' + body;
  }
  if(article){
    article.dataset.bookTitle = book.title || '';
    article.dataset.chapterTitle = chapter.title || '';
    article.dataset.lessonTitle = lesson.title || '';
    article.dataset.lessonId = lesson.id || '';
    article.innerHTML = body;
  }
})();
</script><script src="app.js?v=22.6"></script></body></html>
