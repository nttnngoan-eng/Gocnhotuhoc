.v24-feed{max-width:760px;margin:0 auto 90px}.v24-feed-card{background:#fffaf2;border:1px solid #e2d4c2;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px rgba(92,65,42,.06)}.v24-feed-author{display:flex;gap:10px;align-items:center}.v24-feed-author img{width:42px;height:42px;border-radius:50%;object-fit:cover}.v24-feed-author small{display:block;color:#8c7a68;margin-top:2px}.v24-feed-card h3{color:#6e4d36;margin:14px 0 8px}.v24-feed-card p{line-height:1.65;color:#5d5148}.v24-feed-actions{display:flex;gap:8px;border-top:1px solid #eadfce;padding-top:12px;margin-top:14px}.v24-feed-actions button,.v24-feed-actions a{border:0;background:#f5ecdf;border-radius:10px;padding:8px 12px;color:#6e4d36;text-decoration:none;font:inherit}.v24-feed-media{width:100%;max-height:520px;object-fit:cover;border-radius:14px;margin-top:12px}.v24-feed-video{position:relative;padding-top:56.25%;margin-top:12px}.v24-feed-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:14px}.v24-feed-empty{text-align:center;color:#8c7a68;padding:34px 12px}.v24-bottom-nav{overflow-x:auto}.v24-bottom-nav>*{min-width:74px}
</style><script>
(function(){
 const feed=document.querySelector('[data-v24-view="feed"]');
 if(!feed)return;
 const feedList=document.getElementById('v24FeedList');
 const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 function ytId(url){const m=String(url||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:'';}
 function renderFeed(){
   if(!feedList)return;
   const data=window.GNTT_DATA||{};
   const posts=(Array.isArray(data.feedPosts)?data.feedPosts:[]).filter(p=>p.visibility!=='private').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
   const lessons={};(data.books||[]).forEach(b=>(b.chapters||[]).forEach(c=>(c.lessons||[]).forEach(l=>lessons[l.id]=l)));
   if(!posts.length){feedList.innerHTML='<div class="v24-feed-empty">Chưa có bản tin nào. Các đầu sách vẫn ở Trang chủ như bình thường.</div>';return;}
   feedList.innerHTML=posts.map(p=>{const y=ytId(p.youtube), l=lessons[p.lessonId];const media=p.image?`<img class="v24-feed-media" src="${esc(p.image)}" alt="">`:'';const video=y?`<div class="v24-feed-video"><iframe src="https://www.youtube.com/embed/${esc(y)}" title="YouTube" allowfullscreen loading="lazy"></iframe></div>`:'';const read=l?`<a href="reader.html?id=${encodeURIComponent(l.id)}&v=24.2.15rev10">📖 Đọc ngay</a>`:'';return `<article class="v24-feed-card"><div class="v24-feed-author"><img src="icon-192.png?v=24.2.15rev10" alt=""><div><strong>Góc nhỏ tu học</strong><small>${esc((p.createdAt||'').slice(0,10))}</small></div></div>${p.title?`<h3>${esc(p.title)}</h3>`:''}${p.content?`<p>${esc(p.content).replace(/\n/g,'<br>')}</p>`:''}${media}${video}<div class="v24-feed-actions">${read}<button type="button">♡ Yêu thích</button><button type="button">↗ Chia sẻ</button></div></article>`}).join('');
 }
 renderFeed();

 feed.addEventListener('click',function(){
   document.querySelectorAll('.v24-view').forEach(x=>x.classList.remove('active'));
   const v=document.getElementById('v24ViewFeed'); if(v)v.classList.add('active');
   document.querySelectorAll('.v24-bottom-nav .active').forEach(x=>x.classList.remove('active')); feed.classList.add('active');
   window.scrollTo({top:0,behavior:'smooth'});
 });
 document.querySelectorAll('[data-v24-view="home"]').forEach(b=>b.addEventListener('click',()=>{const v=document.getElementById('v24ViewFeed');if(v)v.classList.remove('active')}));
})();
</script></body></html>
