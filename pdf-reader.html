<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Sách PDF | Góc nhỏ tu học</title><link rel="stylesheet" href="style.css?v=21.1"><style>.pdf-shell{max-width:1200px;margin:18px auto;padding:0 16px}.pdf-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.pdf-head h1{font-size:22px;margin:0}.pdf-author{color:#766b5e;margin:4px 0 0}.pdf-frame{width:100%;height:calc(100vh - 170px);min-height:650px;border:1px solid #dfd1bd;border-radius:12px;background:#fff}.pdf-open{display:inline-block;padding:9px 12px;border:1px solid #d7c7b0;border-radius:9px;text-decoration:none;color:inherit;background:#fff}@media(max-width:700px){.pdf-head{align-items:flex-start;flex-direction:column}.pdf-frame{height:calc(100vh - 210px);min-height:520px}}</style></head><body class="theme-paper"><header class="site-header"><nav class="nav"><a class="brand" href="index.html?v=21.1">📖 Góc nhỏ tu học</a><div class="nav-links"><a href="index.html?v=21.1">Trang chủ</a><a href="library.html?v=21.1">Thư viện</a></div></nav></header><main class="pdf-shell"><div class="pdf-head"><div><a class="back" href="library.html?v=21.1">← Quay lại thư viện</a><h1 id="pdfTitle">Đang tải sách…</h1><p class="pdf-author" id="pdfAuthor"></p></div><a class="pdf-open" id="pdfOpen" target="_blank" rel="noopener">Mở PDF riêng ↗</a></div><iframe id="pdfFrame" class="pdf-frame" title="Sách PDF"></iframe></main><script src="data.js?v=21.1"></script><script>(function(){const id=new URLSearchParams(location.search).get('book');const b=(window.GNTT_DATA?.books||[]).find(x=>x.id===id&&x.type==='pdf');if(!b){document.getElementById('pdfTitle').textContent='Không tìm thấy sách PDF';return;}document.getElementById('pdfTitle').textContent=b.title||'Sách PDF';document.getElementById('pdfAuthor').textContent=[b.author,b.description].filter(Boolean).join(' · ');document.title=(b.title||'Sách PDF')+' | Góc nhỏ tu học';const u=b.pdfUrl;document.getElementById('pdfFrame').src=u;document.getElementById('pdfOpen').href=u;})();</script></body></html>
